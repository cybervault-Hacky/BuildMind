  <!--
    This page is served for ANY unknown path, at ANY depth, from any deployment
    root. A relative stylesheet or script would therefore resolve against the
    bad path (e.g. /build.html/extra/css/main.css) and fail, leaving an unstyled
    error page — which is exactly what a 404 must not be. It is fully
    self-contained instead: inline styles, no external CSS, no JS, no fonts.
    There is nothing left that can 404.

    The two links ARE relative, and this page is served at whatever depth the
    bad URL had, so on /a/b/c they would resolve to /a/b/c/index.html. The tiny
    script at the end of this document rewrites them for the real depth. It is
    allowed by a CSP script hash rather than 'unsafe-inline', so the policy stays
    as tight as the rest of the app. style-src 'unsafe-inline' already covers this, and the colours below
    are copied from the design tokens in css/main.css.
  -->
  <style>

    }

    a.btn:focus-visible { outline: 2px solid #8b93ff; outline-offset: 2px; }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #7c8094;
    }
    @media (prefers-reduced-motion: reduce) {

    }

  <script>
(function(){var p=location.pathname;if(/\/$/.test(p))p=p.slice(0,-1);var d=p.split('/').length-2;if(d<0)d=0;var up=d?new Array(d+1).join('../'):'';var links=document.getElementsByTagName('a');for(var i=0;i<links.length;i++){var h=links[i].getAttribute('href');if(h&&h.indexOf('://')===-1&&h.charAt(0)!=='/'&&h.charAt(0)!=='#'&&h.indexOf('mailto:')!==0){links[i].setAttribute('href',up+h);}}})();
